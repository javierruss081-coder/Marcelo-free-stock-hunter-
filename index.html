<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Marcelo Free Stock Hunter</title>
<link rel="manifest" href="manifest.json">
<style>
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;margin:0;background:#0f172a;color:#e5e7eb}.wrap{max-width:980px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted{color:#94a3b8}.bar,.stats{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.card,.stat,.notice{background:#111827;border:1px solid #334155;border-radius:16px;padding:14px}.stat{flex:1 1 160px}.stat b{display:block;font-size:1.7rem;margin-top:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:14px}button,select,input{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#e5e7eb}button{cursor:pointer}.primary{background:#2563eb;border-color:#2563eb;color:#fff}.pill{display:inline-block;padding:4px 8px;border-radius:999px;font-size:.75rem;font-weight:700;margin-right:6px;background:#1e3a8a}.green{background:#14532d}.score{margin:8px 0}progress{width:100%}a{color:#60a5fa;font-weight:700}dialog{background:#111827;color:#e5e7eb;border:1px solid #475569;border-radius:16px;width:min(620px,90vw)}dialog input{width:100%;box-sizing:border-box}.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
</style>
</head>
<body><div class="wrap">
<h1>🎁 Marcelo Free Stock Hunter</h1><div class="muted">Chromebook Edition — runs directly in Chrome.</div>
<div class="notice">Promotions change fast. Verify the official brokerage terms before signing up. This app never opens accounts, deposits money, or places trades.</div>
<div class="bar"><select id="filter"><option value="all">All offers</option><option value="zero">$0-deposit only</option><option value="new">New only</option></select><button class="primary" id="refresh">🔄 Refresh</button><button id="settings">⚙️ Settings</button><button id="install" hidden>⬇️ Install app</button></div>
<div id="status" class="muted"></div>
<div class="stats"><div class="stat">Offers<b id="count">0</b></div><div class="stat">$0 offers<b id="zero">0</b></div><div class="stat">New<b id="newc">0</b></div></div>
<div id="cards" class="grid"></div>
</div>
<dialog id="dlg"><h2>Live feed</h2><p class="muted">Paste your public offers.json URL.</p><input id="url" type="url" placeholder="https://raw.githubusercontent.com/.../web/offers.json"><div class="row"><button id="sample">Use sample</button><button id="close">Cancel</button><button class="primary" id="save">Save</button></div></dialog>
<script>
const SAMPLE=[{"id":"s1","Broker":"Sample Brokerage","Offer":"Example new-customer stock reward","Reward":"$5–$200 example","Requirement":"$0 deposit indicated","Status":"Sample only","Hunter Score":88,"Why":"Sample data so the Chromebook app works before a live feed is connected.","Source URL":"https://example.com","New":true},{"id":"s2","Broker":"Sample Brokerage 2","Offer":"Example funded-account reward","Reward":"$20 example","Requirement":"Deposit required (example)","Status":"Sample only","Hunter Score":64,"Why":"Second sample for testing filters.","Source URL":"https://example.com","New":false}];
let offers=SAMPLE,deferredPrompt=null;const $=id=>document.getElementById(id);function zero(o){const r=String(o["Requirement"]||"").toLowerCase();return r.startsWith("$0")||r.includes("no deposit")}function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}function render(){const mode=$("filter").value;let list=offers.filter(o=>mode==="all"||(mode==="zero"&&zero(o))||(mode==="new"&&o["New"]));list.sort((a,b)=>(+!!b["New"]-+!!a["New"])||((b["Hunter Score"]||0)-(a["Hunter Score"]||0)));$("count").textContent=offers.length;$("zero").textContent=offers.filter(zero).length;$("newc").textContent=offers.filter(o=>o["New"]).length;$("cards").innerHTML=list.length?list.map(o=>{const s=Math.max(0,Math.min(100,+o["Hunter Score"]||0));const u=/^https?:\/\//i.test(o["Source URL"]||"")?o["Source URL"]:"#";return `<article class="card">${o["New"]?'<span class="pill green">NEW</span>':''}${zero(o)?'<span class="pill green">$0 DEPOSIT</span>':''}<h3>${esc(o["Broker"])}</h3><p><b>${esc(o["Offer"])}</b></p><p>🎁 ${esc(o["Reward"])}</p><p>📌 ${esc(o["Requirement"])}</p><p>🟢 ${esc(o["Status"])}</p><div class="score">Hunter score: <b>${s}/100</b><progress value="${s}" max="100"></progress></div><p class="muted">${esc(o["Why"])}</p><a href="${esc(u)}" target="_blank" rel="noopener noreferrer">Open official source ↗</a></article>`}).join(""):'<div class="muted">No offers match this filter.</div>'}
async function refresh(){const u=localStorage.getItem("feed")||"";if(!u){offers=SAMPLE;$("status").textContent="Showing sample data. Open Settings to connect the live feed.";render();return}$("status").textContent="Refreshing…";try{const r=await fetch(u,{cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const d=await r.json();if(!Array.isArray(d))throw new Error("Feed is not a JSON array");offers=d;$("status").textContent="Updated "+new Date().toLocaleString();render()}catch(e){$("status").textContent="Could not refresh: "+e.message;render()}}
$("filter").onchange=render;$("refresh").onclick=refresh;$("settings").onclick=()=>{$("url").value=localStorage.getItem("feed")||"";$("dlg").showModal()};$("close").onclick=()=>$("dlg").close();$("sample").onclick=()=>{localStorage.removeItem("feed");offers=SAMPLE;$("dlg").close();refresh()};$("save").onclick=()=>{const u=$("url").value.trim();if(u)localStorage.setItem("feed",u);$("dlg").close();refresh()};window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;$("install").hidden=false});$("install").onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$("install").hidden=true}};if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("./service-worker.js").catch(()=>{});render();refresh();
</script></body></html>
