name: Update stock price feed

on:
  workflow_dispatch:
  schedule:
    - cron: "45 21 * * 1-5"

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install market-data package
        run: pip install yfinance

      - name: Build stock price feed
        run: python update_market_data.py

      - name: Commit stock price feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update stock price feed"
            git push
          fi
