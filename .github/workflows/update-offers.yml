name: Update live free-stock feed

on:
  workflow_dispatch:
  schedule:
    - cron: "15 14 * * *"

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scanner packages
        run: pip install requests trafilatura

      - name: Update offers
        run: python update_offers.py

      - name: Save new offers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add offers.json
          if ! git diff --cached --quiet; then
            git commit -m "Update live stock-offer feed"
            git push
          fi
